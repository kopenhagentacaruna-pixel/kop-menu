      }

      body {

        justify-items: center;
        gap: 2px;

        width: 112px;
        height: auto;
        filter: drop-shadow(0 8px 12px rgba(54, 13, 24, 0.18));
      }

        margin: 0;
        color: #f8ddbc;
        font-size: 0.76rem;
        font-weight: 700;
      }

        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 1px;
      }

        align-items: center;
        justify-content: center;
        gap: 5px;
        color: #f8ddbc;
        font-size: 0.7rem;
        font-weight: 700;
        text-decoration: none;
      }

        font-size: 0.7rem;
        font-weight: 700;
